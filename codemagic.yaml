# Codemagic CI — Mac-less iOS build for Interview Prep (Capacitor 8 / SPM).
#
# Setup order:
#   1) Run `ios-bootstrap` once — it registers the Bundle ID and creates the
#      signing certificate + provisioning profile automatically.
#   2) Create the app in App Store Connect (the Bundle ID is now in the dropdown),
#      put its numeric App ID into APP_STORE_APPLE_ID below.
#   3) Run `ios-testflight` — builds and uploads to TestFlight.

workflows:
  ios-bootstrap:
    name: Interview Prep — bootstrap signing + IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicAPIKey
    environment:
      vars:
        BUNDLE_ID: "com.araz.interviewprep"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Web build + Capacitor sync
        script: |
          npm run build
          npx cap sync ios
      - name: Signing (creates Bundle ID, certificate and profile if missing)
        script: |
          set -e
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Interview Prep — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicAPIKey
    environment:
      vars:
        BUNDLE_ID: "com.araz.interviewprep"
        APP_STORE_APPLE_ID: 0
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Web build + Capacitor sync
        script: |
          npm run build
          npx cap sync ios
      - name: Signing
        script: |
          set -e
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bump build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
